version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: unblock
      POSTGRES_PASSWORD: unblock
      POSTGRES_DB: unblock
    ports:
      - "5432:5432"
    volumes:
      - unblock_pgdata:/var/lib/postgresql/data
      # Runs every .sql file here (in order) on first container start only.
      - ./storage/migrations:/docker-entrypoint-initdb.d

volumes:
  unblock_pgdata:
